<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="./css/style.css">
</head>
<body>
   <main>
        <div class="container">
            <div class="row">
                <div class="col-3"></div>
                <div class="col-6 cover">
                    <h1>Currency Converter</h1>
                    <form>
                        <label>
                            Enter Amount
                            <input type="number" required class="col-7">
                        </label>
                    
                        <div class="col-2"></div>
                        <div class="col-7 flex justify-sb contury">
                            <div class="col-t-12  first_side">
                                <h3>Form</h3>
                                <select class="first_select">
                                </select>
                            </div>

                            <div class="col-t-12  arrow center">
                                <button type="button"><img src="../img/arrow.svg" alt="Exchange" width="30" height="30" class="img"></button>
                            </div>

                            <div class="col-t-12  second_side">
                                <h3>To</h3>
                                <select class="second_select">

                                </select>
                            </div>
                        </div>
                        <div class="col-3"></div>

                        <p></p>
                        <div class="col-7 col-t-12 submit_button">
                            <button type="submit" class="submit">Get Exchange Rates</button>
                        </div>
                    </form>
                </div>
            </div>

        </div>
   </main> 


   <script src="./js/script.js"></script>
</body>
</html>
